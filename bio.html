<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>@58dw</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* Force custom cursor on EVERYTHING */
        *, *:hover, button, #sound-btn, #sound-btn:hover, .link-btn {
            cursor: url('https://raw.githubusercontent.com/dariosfiles/juegosboti/refs/heads/main/Hand%201.cur'), auto !important;
        }

        body {
            margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;
            background-color: #0f0f0f; font-family: 'Press Start 2P', cursive;
            user-select: none; overflow: hidden;
        }

        /* Black Overlay */
        #overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: black; z-index: 100; display: flex;
            justify-content: center; align-items: center; color: white;
            font-size: 14px; text-align: center; cursor: pointer;
            opacity: 1; transition: opacity 0.5s ease;
        }

        /* Card Styling */
        .discord-card {
            background: rgba(30, 30, 30, 0.9); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); color: white;
            padding: 25px; border-radius: 20px; width: 350px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            transform-style: preserve-3d; perspective: 1000px;
        }

        .header-section { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        #avatar { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #444; }
        
        .user-info { display: flex; flex-direction: column; gap: 8px; }
        .controls { display: flex; align-items: center; gap: 10px; }
        
        #username { font-size: 0.7em; font-weight: bold; }
        
        #sound-btn { color: #aaa; transition: 0.3s; display: flex; }
        #sound-btn:hover { color: white; }

        .link-btn {
            font-size: 0.5em; color: #fff; text-decoration: underline;
            transition: 0.3s; padding: 5px; border-radius: 5px;
        }
        .link-btn:hover { color: #5865F2; background: rgba(255,255,255,0.1); }

        .status-wrapper { display: flex; align-items: center; background: rgba(0, 0, 0, 0.3); padding: 10px; border-radius: 10px; }
        .status-dot { height: 12px; width: 12px; border-radius: 50%; margin-right: 10px; }
        #status-text { font-size: 0.6em; }
    </style>
</head>
<body>

    <div id="overlay">CLICK ANYWHERE TO PROCEED...</div>

    <audio id="bg-audio" loop preload="auto">
        <source src="https://raw.githubusercontent.com/dariosfiles/juegosboti/refs/heads/main/arizona-zervas-roxanne.mp3" type="audio/mpeg">
    </audio>

    <div id="tilt-box" class="discord-card">
        <div class="header-section">
            <img id="avatar" src="" alt="Avatar">
            <div class="user-info">
                <div id="username">@Loading...</div>
                <div class="controls">
                    <div id="sound-btn" onclick="toggleSound()">
                        <i data-lucide="volume-2" id="icon-vol"></i>
                    </div>
                    <a href="https://discord.gg/tyyjBu4eF6" target="_blank" class="link-btn">JOIN OREO HUB</a>
                </div>
            </div>
        </div>
        <div class="status-wrapper">
            <span id="status-dot" class="status-dot"></span>
            <span id="status-text">Checking...</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
    <script>
        // Typewriter Title Effect
        let titleText = "@58dw";
        let index = 0;
        let isDeleting = false;
        
        function type() {
            document.title = titleText.substring(0, index);
            if (!isDeleting && index < titleText.length) {
                index++;
                setTimeout(type, 300);
            } else if (isDeleting && index > 1) { 
                index--;
                setTimeout(type, 150);
            } else {
                isDeleting = !isDeleting;
                setTimeout(type, 1000);
            }
        }
        type();

        const audio = document.getElementById('bg-audio');
        const overlay = document.getElementById('overlay');
        let isPlaying = false;

        lucide.createIcons();

        overlay.addEventListener('click', () => {
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 500);
            audio.play();
            isPlaying = true;
        });

        function toggleSound() {
            const icon = document.getElementById('icon-vol');
            if (isPlaying) {
                audio.pause();
                icon.setAttribute("data-lucide", "volume-x");
            } else {
                audio.play();
                icon.setAttribute("data-lucide", "volume-2");
            }
            isPlaying = !isPlaying;
            lucide.createIcons();
        }

        document.addEventListener('contextmenu', e => e.preventDefault());
        VanillaTilt.init(document.querySelector("#tilt-box"), { max: 20, speed: 400, glare: true, "max-glare": 0.3 });

        const userId = "1345054668065079439";
        async function fetchStatus() {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${userId}`);
                const result = await response.json();
                if (result.success) {
                    const data = result.data;
                    document.getElementById('avatar').src = data.discord_user.avatar 
                        ? `https://cdn.discordapp.com/avatars/${userId}/${data.discord_user.avatar}.png` 
                        : 'https://cdn.discordapp.com/embed/avatars/0.png';
                    document.getElementById('username').innerText = `@${data.discord_user.username}`;
                    const status = data.discord_status;
                    document.getElementById('status-text').innerText = status.toUpperCase();
                    const colors = { online: "#43b581", idle: "#faa61a", dnd: "#f04747", offline: "#747f8d" };
                    document.getElementById('status-dot').style.backgroundColor = colors[status] || "#747f8d";
                }
            } catch (e) { console.error(e); }
        }
        fetchStatus();
        setInterval(fetchStatus, 30000);
    </script>
</body>
</html>
