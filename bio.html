<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>@58dw</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        *, *:hover, button, #sound-btn, #sound-btn:hover, .link-btn, .copy-btn {
            cursor: url('https://raw.githubusercontent.com/dariosfiles/juegosboti/refs/heads/main/Hand%201.cur'), auto !important;
        }

        body {
            margin: 0; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background-color: #0f0f0f; font-family: 'Press Start 2P', cursive;
            user-select: none; overflow: hidden; gap: 20px;
        }

        .row { display: flex; flex-direction: row; gap: 20px; align-items: stretch; }

        #overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: black; z-index: 100; display: flex;
            justify-content: center; align-items: center; color: white;
            font-size: 14px; text-align: center; cursor: pointer;
            opacity: 1; transition: opacity 0.5s ease;
        }

        .discord-card {
            background: rgba(30, 30, 30, 0.9); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); color: white;
            padding: 25px; border-radius: 20px; width: 350px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            transform-style: preserve-3d; perspective: 1000px;
            display: flex; flex-direction: column;
        }

        .header-section { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        #avatar { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #444; }
        .user-info { display: flex; flex-direction: column; gap: 8px; }
        .controls { display: flex; align-items: center; gap: 10px; }
        #username { font-size: 0.7em; font-weight: bold; }
        #sound-btn { color: #aaa; transition: 0.3s; display: flex; }
        #sound-btn:hover { color: white; }
        .link-btn {
            font-size: 0.5em; color: #fff; text-decoration: underline;
            transition: 0.3s; padding: 5px; border-radius: 5px;
        }
        .link-btn:hover { color: #5865F2; background: rgba(255,255,255,0.1); }
        .status-wrapper { display: flex; align-items: center; background: rgba(0, 0, 0, 0.3); padding: 10px; border-radius: 10px; margin-top: auto; }
        #status-icon { width: 16px; height: 16px; margin-right: 10px; }
        #status-text { font-size: 0.6em; }
        
        .about-card { font-size: 0.6em; line-height: 1.6; }
        .about-title { margin-bottom: 15px; display: block; color: #5865F2; }
        
        .time-card { align-items: center; justify-content: center; }
        .time-display { font-size: 1.2em; margin-top: 15px; color: #fff; }

        .socials-row { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; margin-top: 10px; }
        .socials-img { width: 24px; height: 24px; }
        .copy-btn { border: none; background: none; color: white; cursor: pointer; padding: 5px; }
    </style>
</head>
<body>

    <div id="overlay">CLICK ANYWHERE TO PROCEED...</div>

    <audio id="bg-audio" loop preload="auto">
        <source src="https://raw.githubusercontent.com/dariosfiles/juegosboti/refs/heads/main/arizona-zervas-roxanne.mp3" type="audio/mpeg">
    </audio>

    <div class="row">
        <div id="tilt-box-1" class="discord-card">
            <div class="header-section">
                <img id="avatar" src="" alt="Avatar">
                <div class="user-info">
                    <div id="username">@Loading...</div>
                    <div class="controls">
                        <div id="sound-btn" onclick="toggleSound()">
                            <i data-lucide="volume-2" id="icon-vol"></i>
                        </div>
                        <a href="https://discord.gg/Xu4VATh9Dt" target="_blank" class="link-btn">JOIN LUCKY UNCOPYLOCKEDS</a>
                    </div>
                </div>
            </div>
            <div class="status-wrapper">
                <svg id="status-icon" viewBox="0 0 24 24"></svg>
                <span id="status-text">Checking...</span>
            </div>
        </div>

        <div id="tilt-box-2" class="discord-card time-card">
            <span style="color: #5865F2; font-size: 0.8em;">Current time</span>
            <div id="clock" class="time-display">00:00:00</div>
            <p style="font-size: 0.7em; margin-top: 10px;">Cádiz, Spain</p>
        </div>
    </div>

    <div class="row">
        <div class="discord-card about-card" style="width: 350px;">
            <span class="about-title">About me</span>
            <p>i like making stuff</p>
            <p id="bday-timer">loading...</p>
            
            <span class="about-title" style="margin-top:20px">Socials</span>
            <div class="socials-row">
                <img src="https://raw.githubusercontent.com/dariosfiles/ogm/refs/heads/main/481292-fortnite.png" class="socials-img">
                <span style="flex-grow: 1;">netanyahu primeǃ</span>
                <button class="copy-btn" onclick="copyText('netanyahu primeǃ', this)">
                    <i data-lucide="copy"></i>
                </button>
            </div>
        </div>
        
        <div class="discord-card about-card" style="width: 350px;">
            <span class="about-title">Weather</span>
            <p id="weather-temp">Loading...</p>
            <p id="weather-message"></p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
    <script>
        async function fetchWeather() {
            try {
                const response = await fetch("https://api.open-meteo.com/v1/forecast?latitude=36.75&longitude=-5.8&current=temperature_2m");
                const data = await response.json();
                const temp = Math.round(data.current.temperature_2m);
                
                document.getElementById('weather-temp').innerText = `Where i live its ${temp}°C`;
                
                if (temp > 30) {
                    document.getElementById('weather-message').innerText = "Yeah, its hot over here.";
                } else {
                    document.getElementById('weather-message').innerText = "Pretty normal temperature.";
                }
            } catch (e) {
                document.getElementById('weather-temp').innerText = "Weather unavailable";
            }
        }
        
        fetchWeather();
        setInterval(fetchWeather, 20000);

        let titleText = "@58dw";
        let index = 0;
        let isDeleting = false;
        function type() {
            document.title = titleText.substring(0, index);
            if (!isDeleting && index < titleText.length) { index++; setTimeout(type, 300); }
            else if (isDeleting && index > 1) { index--; setTimeout(type, 150); }
            else { isDeleting = !isDeleting; setTimeout(type, 1000); }
        }
        type();

        function copyText(text, btn) {
            navigator.clipboard.writeText(text);
            const icon = btn.querySelector('i');
            icon.setAttribute("data-lucide", "check");
            lucide.createIcons();
            setTimeout(() => {
                icon.setAttribute("data-lucide", "copy");
                lucide.createIcons();
            }, 2000);
        }

        function updateClock() {
            const time = new Date().toLocaleTimeString('es-ES', { timeZone: 'Europe/Madrid' });
            document.getElementById('clock').innerText = time;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function updateBday() {
            const now = new Date();
            let bday = new Date(now.getFullYear(), 11, 23);
            if (now > bday) bday.setFullYear(now.getFullYear() + 1);
            const diff = bday - now;
            const m = Math.floor(diff / (1000 * 60 * 60 * 24 * 30));
            const w = Math.floor((diff % (1000 * 60 * 60 * 24 * 30)) / (1000 * 60 * 60 * 24 * 7));
            const d = Math.floor((diff % (1000 * 60 * 60 * 24 * 7)) / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);
            document.getElementById('bday-timer').innerText = `bday in: ${m}m ${w}w ${d}d ${h}h ${s}s`;
        }
        setInterval(updateBday, 1000);

        const audio = document.getElementById('bg-audio');
        const overlay = document.getElementById('overlay');
        let isPlaying = false;
        lucide.createIcons();

        overlay.addEventListener('click', () => {
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 500);
            audio.play();
            isPlaying = true;
        });

        function toggleSound() {
            const icon = document.getElementById('icon-vol');
            if (isPlaying) { audio.pause(); icon.setAttribute("data-lucide", "volume-x"); }
            else { audio.play(); icon.setAttribute("data-lucide", "volume-2"); }
            isPlaying = !isPlaying;
            lucide.createIcons();
        }

        document.addEventListener('contextmenu', e => e.preventDefault());
        VanillaTilt.init(document.querySelectorAll(".discord-card"), { max: 20, speed: 400, glare: true, "max-glare": 0.3 });

        const userId = "1345054668065079439";
        async function fetchStatus() {
            const icons = {
                online: '<circle cx="12" cy="12" r="10" fill="#43b581"/>',
                idle: '<path d="M12 2a10 10 0 1 0 10 10H12Z" fill="#faa61a"/>',
                dnd: '<circle cx="12" cy="12" r="10" fill="#f04747"/><rect x="7" y="11" width="10" height="2" fill="white"/>',
                offline: '<circle cx="12" cy="12" r="8" fill="none" stroke="#747f8d" stroke-width="4"/>'
            };
            const customStatus = {
                online: "Im available, and that's weird",
                idle: "Taking a nap probably",
                dnd: "Probably just not doing anything",
                offline: "Offline"
            };
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${userId}`);
                const result = await response.json();
                if (result.success) {
                    const data = result.data;
                    document.getElementById('avatar').src = data.discord_user.avatar ? `https://cdn.discordapp.com/avatars/${userId}/${data.discord_user.avatar}.png` : 'https://cdn.discordapp.com/embed/avatars/0.png';
                    document.getElementById('username').innerText = `@${data.discord_user.username}`;
                    const status = data.discord_status;
                    document.getElementById('status-text').innerText = customStatus[status] || status.toUpperCase();
                    document.getElementById('status-icon').innerHTML = icons[status] || icons.offline;
                }
            } catch (e) { console.error(e); }
        }
        fetchStatus();
        setInterval(fetchStatus, 30000);
    </script>
</body>
</html>
