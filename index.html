<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>✅ Watch for free & online - Ready!</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:Inter,Arial,sans-serif;
background:radial-gradient(circle at 50% -10%,#292929 0,#111 42%,#070707 100%);
color:#fff;
overflow:hidden
}
body:before{
content:"";
position:fixed;
width:500px;
height:500px;
background:#ff005022;
filter:blur(120px);
top:-250px;
left:50%;
transform:translateX(-50%);
pointer-events:none
}
.card{
width:min(440px,calc(100% - 30px));
padding:38px 32px 30px;
border:1px solid #303030;
border-radius:24px;
background:rgba(18,18,18,.88);
box-shadow:0 30px 100px #000b,inset 0 1px #ffffff08;
backdrop-filter:blur(25px);
animation:enter .55s ease
}
@keyframes enter{
from{opacity:0;transform:translateY(18px) scale(.97)}
to{opacity:1;transform:translateY(0) scale(1)}
}
.logo{
width:68px;
height:68px;
display:flex;
align-items:center;
justify-content:center;
margin:0 auto 21px;
border-radius:20px;
background:linear-gradient(135deg,#ff315c,#ff0050);
box-shadow:0 12px 40px #ff005033;
font-size:31px
}
h1{
text-align:center;
font-size:28px;
font-weight:750;
letter-spacing:-.8px
}
.sub{
margin:9px auto 29px;
max-width:330px;
text-align:center;
color:#929292;
font-size:14px;
line-height:1.55
}
.step{
padding:17px;
border-radius:15px;
border:1px solid #303030;
background:#151515
}
.row{
display:flex;
align-items:center;
gap:11px
}
.number{
width:28px;
height:28px;
flex-shrink:0;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
background:#292929;
color:#bdbdbd;
font-size:12px;
font-weight:700
}
.title{
font-size:14px;
font-weight:650
}
.desc{
margin:8px 0 0 39px;
font-size:12px;
color:#6f6f6f
}
button{
width:100%;
height:50px;
margin-top:18px;
border:0;
border-radius:13px;
background:linear-gradient(135deg,#ff315c,#ff0050);
color:#fff;
font-size:14px;
font-weight:700;
cursor:pointer;
transition:.2s;
box-shadow:0 12px 30px #ff005022
}
button:hover{
transform:translateY(-2px);
box-shadow:0 15px 38px #ff005038
}
button:active{transform:scale(.985)}
button.loading{
background:#242424;
box-shadow:none;
cursor:default;
transform:none
}
.status{
display:none;
margin-top:19px;
padding:14px 15px;
border-radius:13px;
border:1px solid #2e2e2e;
background:#111;
color:#aaa;
font-size:13px;
text-align:center
}
.spinner{
display:inline-block;
width:16px;
height:16px;
margin-right:8px;
vertical-align:-3px;
border:2px solid #3c3c3c;
border-top-color:#fff;
border-radius:50%;
animation:spin .75s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{
margin-top:22px;
text-align:center;
color:#4f4f4f;
font-size:11px
}
</style>
</head>
<body>

<div class="card">
<div class="logo">✓</div>
<h1>Watch for free</h1>
<p class="sub">Complete the step below to unlock your free access.</p>

<div class="step">
<div class="row">
<div class="number">1</div>
<div class="title">Follow on TikTok</div>
</div>
<div class="desc">Follow @latenightdario to continue.</div>
</div>

<button id="unlockBtn">Follow on TikTok</button>

<div class="status" id="status">
<span class="spinner"></span>
<span>Verifying...</span>
</div>

<div class="footer">Secure verification · Free access</div>
</div>

<script>
const button=document.getElementById("unlockBtn");
const status=document.getElementById("status");

button.addEventListener("click",function(){
if(button.disabled)return;

const tiktokTab=window.open(
"https://www.tiktok.com/@latenightdario",
"_blank"
);

button.disabled=true;
button.classList.add("loading");
button.textContent="Verifying...";
status.style.display="block";

if(!tiktokTab){
status.innerHTML='<span>Allow pop-ups to continue</span>';
button.disabled=false;
button.classList.remove("loading");
button.textContent="Follow on TikTok";
}
});
</script>

</body>
</html>
