<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGMarket</title>
    <script src="https://sellauth.com/assets/js/sellauth-embed-2.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --accent-color: #000000;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 4rem;
        }

        header {
            padding: 2rem;
            text-align: center;
            width: 100%;
            border-bottom: 1px solid #eaeaea;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: -0.05rem;
            text-transform: uppercase;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 3rem;
            margin-top: 4rem;
            max-width: 1200px;
            padding: 0 2rem;
        }

        .product-card {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 300px;
            text-align: center;
        }

        .product-image {
            width: 100%;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f9f9f9;
        }

        .product-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .product-info h2 {
            margin: 0.5rem 0;
            font-size: 1.5rem;
        }

        .sellauth-button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 1rem 2rem;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .sellauth-button:hover {
            opacity: 0.8;
        }

        .icon { width: 20px; height: 20px; }
    </style>
</head>
<body>

    <header>
        <h1>OGMarket</h1>
    </header>

    <main class="container">
        <div class="product-card">
            <div class="product-image">
                <img src="https://static.wikia.nocookie.net/stealabr/images/3/34/Skibidi_toilet.png/revision/latest?cb=20251227221221" alt="Skibidi Toilet">
            </div>
            <div class="product-info">
                <h2>Skibidi Toilet</h2>
                <button
                  type="button"
                  class="sellauth-button"
                  onclick="window.sellAuthEmbed.checkout(this, { 
                    cart: [{ productId: 667825, variantId: 1055741, quantity: 1 }],
                    shopId: 227377,
                    modal: true
                  })"
                >
                  <span>Buy Now</span>
                  <svg xmlns="http://www.w3.org/2000/svg" class="icon" fill="currentColor" viewBox="0 0 256 256"><path d="M230.14,58.87A8,8,0,0,0,224,56H62.68L56.6,22.57A8,8,0,0,0,48.73,16H24a8,8,0,0,0,0,16h18L67.56,172.29a24,24,0,0,0,5.33,11.27,28,28,0,1,0,44.4,8.44h45.42A27.75,27.75,0,0,0,160,204a28,28,0,1,0,28-28H91.17a8,8,0,0,1-7.87-6.57L80.13,152h116a24,24,0,0,0,23.61-19.71l12.16-66.86A8,8,0,0,0,230.14,58.87ZM104,204a12,12,0,1,1-12-12A12,12,0,0,1,104,204Zm96,0a12,12,0,1,1-12-12A12,12,0,0,1,200,204Zm4-74.57A8,8,0,0,1,196.1,136H77.22L65.59,72H214.41Z"></path></svg>
                </button>
            </div>
        </div>

        <div class="product-card">
            <div class="product-image">
                <img src="https://static.wikia.nocookie.net/stealabr/images/5/58/Strawberryelephant.png/revision/latest?cb=20260317001745" alt="Strawberry Elephant">
            </div>
            <div class="product-info">
                <h2>Strawberry Elephant</h2>
                <button
                  type="button"
                  class="sellauth-button"
                  onclick="window.sellAuthEmbed.checkout(this, { 
                    cart: [{ productId: 735107, variantId: 1200365, quantity: 1 }],
                    shopId: 227377,
                    modal: true
                  })"
                >
                  <span>Buy Now</span>
                  <svg xmlns="http://www.w3.org/2000/svg" class="icon" fill="currentColor" viewBox="0 0 256 256"><path d="M230.14,58.87A8,8,0,0,0,224,56H62.68L56.6,22.57A8,8,0,0,0,48.73,16H24a8,8,0,0,0,0,16h18L67.56,172.29a24,24,0,0,0,5.33,11.27,28,28,0,1,0,44.4,8.44h45.42A27.75,27.75,0,0,0,160,204a28,28,0,1,0,28-28H91.17a8,8,0,0,1-7.87-6.57L80.13,152h116a24,24,0,0,0,23.61-19.71l12.16-66.86A8,8,0,0,0,230.14,58.87ZM104,204a12,12,0,1,1-12-12A12,12,0,0,1,104,204Zm96,0a12,12,0,1,1-12-12A12,12,0,0,1,200,204Zm4-74.57A8,8,0,0,1,196.1,136H77.22L65.59,72H214.41Z"></path></svg>
                </button>
            </div>
        </div>

        <div class="product-card">
            <div class="product-image">
                <img src="https://static.wikia.nocookie.net/stealabr/images/d/d2/John_Pork.png/revision/latest?cb=20260502233229" alt="John Pork">
            </div>
            <div class="product-info">
                <h2>John Pork</h2>
                <button
                  type="button"
                  class="sellauth-button"
                  onclick="window.sellAuthEmbed.checkout(this, { 
                    cart: [{ productId: 735114, variantId: 1200380, quantity: 1 }],
                    shopId: 227377,
                    modal: true
                  })"
                >
                  <span>Buy Now</span>
                  <svg xmlns="http://www.w3.org/2000/svg" class="icon" fill="currentColor" viewBox="0 0 256 256"><path d="M230.14,58.87A8,8,0,0,0,224,56H62.68L56.6,22.57A8,8,0,0,0,48.73,16H24a8,8,0,0,0,0,16h18L67.56,172.29a24,24,0,0,0,5.33,11.27,28,28,0,1,0,44.4,8.44h45.42A27.75,27.75,0,0,0,160,204a28,28,0,1,0,28-28H91.17a8,8,0,0,1-7.87-6.57L80.13,152h116a24,24,0,0,0,23.61-19.71l12.16-66.86A8,8,0,0,0,230.14,58.87ZM104,204a12,12,0,1,1-12-12A12,12,0,0,1,104,204Zm96,0a12,12,0,1,1-12-12A12,12,0,0,1,200,204Zm4-74.57A8,8,0,0,1,196.1,136H77.22L65.59,72H214.41Z"></path></svg>
                </button>
            </div>
        </div>
    </main>

    <script>
        // Trigger alert with warning icon after 1 second
        setTimeout(() => {
            Swal.fire({
                icon: 'warning',
                title: 'Welcome!',
                text: 'We are currently working on the site, please note that, there will be a lot of more products when we are done :)',
                confirmButtonText: 'Great',
                confirmButtonColor: '#000000'
            });
        }, 0);
    </script>
</body>
</html>
