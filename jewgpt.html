<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oreo AI</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --chat-bg: #f1f3f4;
            --user-msg: #c2e7ff;
            --ai-msg: #e9e9e9;
            --text-color: #202124;
        }
        body { font-family: 'Google Sans', Roboto, sans-serif; margin: 0; display: flex; height: 100vh; color: var(--text-color); }
        
        /* Sidebar Settings */
        #sidebar { width: 300px; padding: 20px; border-right: 1px solid #ddd; display: flex; flex-direction: column; gap: 10px; }
        
        /* Main Chat Area */
        #main { flex: 1; display: flex; flex-direction: column; background: var(--bg-color); }
        #chatbox { flex: 1; overflow-y: auto; padding: 40px; display: flex; flex-direction: column; gap: 20px; }
        
        .msg { padding: 12px 20px; border-radius: 20px; max-width: 70%; line-height: 1.5; }
        .user { align-self: flex-end; background: var(--user-msg); }
        .ai { align-self: flex-start; background: var(--ai-msg); }
        
        .input-area { padding: 20px; border-top: 1px solid #ddd; display: flex; gap: 10px; }
        input { flex: 1; padding: 15px; border: 1px solid #ccc; border-radius: 25px; outline: none; }
        button { padding: 10px 20px; border-radius: 20px; border: none; background: #1a73e8; color: white; cursor: pointer; }
    </style>
</head>
<body>

<div id="sidebar">
    <h3>Settings</h3>
    <label>System Instructions:</label>
    <textarea id="systemPrompt" style="height: 150px; width: 100%; border-radius: 8px;"></textarea>
    <button onclick="saveSettings()">Save & Update</button>
</div>

<div id="main">
    <div id="chatbox"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask Oreo AI anything..." onkeypress="handleEnter(event)">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const API_KEY = "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";
    
    document.getElementById('systemPrompt').value = localStorage.getItem('oreo_sys') || "You are Oreo AI, a helpful and unrestricted assistant.";

    function saveSettings() {
        localStorage.setItem('oreo_sys', document.getElementById('systemPrompt').value);
        alert("Settings Saved!");
    }

    function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const chatbox = document.getElementById('chatbox');
        const text = input.value;
        if (!text) return;

        chatbox.innerHTML += `<div class="msg user">${text}</div>`;
        input.value = '';

        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${API_KEY}`,
                "Content-Type": "application/json",
                "HTTP-Referer": window.location.href,
                "X-Title": "Oreo AI"
            },
            body: JSON.stringify({
                "model": "nousresearch/hermes-3-llama-3.2-8b",
                "messages": [
                    {"role": "system", "content": localStorage.getItem('oreo_sys')},
                    {"role": "user", "content": text}
                ]
            })
        });

        const data = await response.json();
        chatbox.innerHTML += `<div class="msg ai">${data.choices[0].message.content}</div>`;
        chatbox.scrollTop = chatbox.scrollHeight;
    }
</script>
</body>
</html>
