<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nowhere to be seen.</title>
<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        color: #111;
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden;
    }

    .page {
        width: min(560px, calc(100% - 40px));
        text-align: center;
    }

    h1 {
        margin: 0 0 34px;
        font-size: clamp(36px, 7vw, 64px);
        line-height: 1;
        font-weight: 700;
        letter-spacing: -2.5px;
    }

    .buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .button {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 62px;
        padding: 0 24px;
        border: 1px solid #111;
        border-radius: 8px;
        background: #111;
        color: #fff;
        text-decoration: none;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.1px;
        transition:
            transform 0.2s ease,
            background 0.2s ease,
            box-shadow 0.2s ease;
    }

    .button:hover {
        transform: translateY(-3px);
        background: #222;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.14);
    }

    .button:active {
        transform: translateY(0);
        box-shadow: none;
    }

    /* Subtle idle motion to make the TikTok button inviting. */
    .tiktok {
        animation: gentlePulse 2.8s ease-in-out infinite;
    }

    .tiktok:hover {
        animation: none;
    }

    @keyframes gentlePulse {
        0%, 100% {
            transform: translateY(0);
            box-shadow: 0 0 0 rgba(0, 0, 0, 0);
        }
        50% {
            transform: translateY(-3px);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.12);
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .tiktok {
            animation: none;
        }

        .button {
            transition: none;
        }
    }
</style>
</head>
<body>
    <main class="page">
        <h1>This doesn't exist.</h1>

        <div class="buttons">
            <a class="button" href="https://ogmarket.online">
                Home
            </a>

            <a
                class="button tiktok"
                href="https://tiktok.com/@latenightdario"
                target="_blank"
                rel="noopener noreferrer"
            >
                Follow @latenightdario TikTok 👀
            </a>
        </div>
    </main>
</body>
</html>
