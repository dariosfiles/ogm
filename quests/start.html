<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="Unlock the Link">
  <meta property="og:description" content="Content by @gxk">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ogmarket.online/stepload-38120281">
  <meta name="theme-color" content="#8b5cf6">

  <title>Unlock your destiny</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at 50% 15%, rgba(124, 92, 255, 0.18), transparent 35%),
        #08080c;
      color: #fff;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: min(430px, 100%);
      padding: 42px 32px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      background: rgba(18, 18, 25, 0.82);
      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      animation: cardIn 0.55s ease-out;
    }

    .icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 17px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      box-shadow: 0 12px 35px rgba(99, 102, 241, 0.3);
      font-size: 25px;
      font-weight: 800;
    }

    h1 {
      font-size: 31px;
      font-weight: 750;
      letter-spacing: -0.8px;
      margin-bottom: 9px;
    }

    .author {
      color: #777783;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .author span {
      color: #9b82ff;
      font-weight: 600;
    }

    .subtitle {
      color: #92929d;
      font-size: 15px;
      line-height: 1.6;
    }

    .go-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 52px;
      margin-top: 27px;
      border-radius: 13px;
      color: white;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        filter 0.2s ease;
    }

    .go-button:hover {
      transform: translateY(-3px);
      filter: brightness(1.08);
      box-shadow: 0 14px 35px rgba(99, 102, 241, 0.4);
    }

    .go-button:active {
      transform: translateY(-1px);
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(15px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="icon">✦</div>

    <h1>Unlock your destiny</h1>

    <div class="author">
      by <span>@gxk</span>
    </div>

    <p class="subtitle">
      Your journey is waiting. Take the next step below.
    </p>

    <a
      class="go-button"
      href="https://ogmarket.online/stepload-38120281"
    >
      Go now
    </a>

  </main>

</body>
</html>
